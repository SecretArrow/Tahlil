# Project-wide Gradle settings.
# IMPORTANT: This file should *NOT* be checked into Version Control Systems,
# as it contains information specific to your local configuration.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Non-transitive R classes
android.nonTransitiveRClass=true

# Disable build features
android.defaults.buildfeatures.buildconfig=true

# Enable Gradle Build Cache
org.gradle.caching=true

# Parallel builds
org.gradle.parallel=true

# Configuration on demand
org.gradle.configureondemand=false

# R8 COMPAT MODE — defense in depth after the toolchain upgrade.
# The crash that prompted this flag was the documented R8 full-mode
# interface-merging bug with Compose UI 1.6.x (the `ModifierLocalProvider.all(...)`
# IncompatibleClassChangeError). After upgrading to Kotlin 2.0.21 + Compose
# BOM 2024.09.03 (= Compose UI 1.7.x, which refactored that interface),
# R8 full mode is now safe to leave enabled — Singkat ships with the default
# (true). We keep fullMode=false here as belt-and-suspenders for one release
# cycle; remove once v1.1.0 has shipped cleanly in the wild.
android.enableR8.fullMode=false
