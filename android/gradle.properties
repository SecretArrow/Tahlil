# Project-wide Gradle settings.
# IMPORTANT: This file should *NOT* be checked into Version Control Systems,
# as it contains information specific to your local configuration.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Non-transitive R classes
android.nonTransitiveRClass=true

# Disable build features
android.defaults.buildfeatures.buildconfig=true

# Enable Gradle Build Cache
org.gradle.caching=true

# Parallel builds
org.gradle.parallel=true

# Configuration on demand
org.gradle.configureondemand=false

# R8 COMPAT MODE (full mode OFF).
# R8 full mode (AGP 8 default) performs horizontal interface merging that
# produces:
#   java.lang.IncompatibleClassChangeError: Conflicting default method
#   implementations boolean androidx.compose.ui.modifier.ModifierLocalProvider.all(...)
# on the FIRST composed frame of the minified release build — the actual root
# cause of the historical force-close on real devices (v12). Compat mode
# skips that interface merging and is the officially recommended workaround
# for this class of bug. Size difference vs full mode: ~1-3%.
android.enableR8.fullMode=false
