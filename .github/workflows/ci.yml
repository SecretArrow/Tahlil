name: CI

# ============================================================
# Tahlil & Doa — Continuous Integration & Delivery Pipeline
# ============================================================
#
# Triggers:
#   - push to main          → run tests, build artifacts, create Release
#   - pull request to main  → run tests only
#   - manual dispatch       → run everything (optionally build & release)
#
# Parallel jobs:
#   - web-test                → Next.js lint + build (web/)
#   - android-test            → ./gradlew lint test + assembleRelease
#   - android-split-apks      → depends on android-test, runs ABI splits + verifies each APK
#   - android-instrumented-test → depends on android-test, runs instrumentation tests on emulator
#
# Required secrets (for signed Android release APKs):
#   - KEYSTORE_BASE64       base64-encoded *.jks keystore
#   - KEYSTORE_PASSWORD     keystore password
#   - KEY_ALIAS             key alias inside the keystore
#   - KEY_PASSWORD          password for the key alias
#
# When all secrets are present, the release APKs are signed. Otherwise the
# build falls back to debug signing so the pipeline still produces APKs.
# ============================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release with all artifacts"
        type: boolean
        default: false

# Cancel any in-flight run when a new commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions needed by softprops/action-gh-release to upload release assets.
permissions:
  contents: write

jobs:
  # ============================================================
  # 1. Web (Next.js) — lint + build
  # ============================================================
  web-test:
    name: Web — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (Next.js)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            web/.next
            web/public
            web/package.json
            web/next.config.ts
            web/next-env.d.ts
          retention-days: 14
          if-no-files-found: error

  # ============================================================
  # 2. Android — gradle lint, unit tests, assembleRelease
  # ============================================================
  android-test:
    name: Android — lint, test, assemble
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore (if secrets present)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "keystore_present=true" >> "$GITHUB_OUTPUT"
            echo "Signing keystore installed."
          else
            echo "keystore_present=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets found — using debug signing."
          fi

      - name: Gradle lint
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew lint --no-daemon --stacktrace

      - name: Unit tests
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build release APK(s) with signing secrets
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: |
            android/app/build/reports/lint-results-*.html
            android/app/build/reports/lint-results-*.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests
            android/app/build/test-results
          retention-days: 14
          if-no-files-found: warn

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error

  # ============================================================
  # 3. Verify each split APK with apksigner
  # ============================================================
  android-split-apks:
    name: Android — verify split APKs
    needs: android-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (for apksigner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: apks

      - name: List APKs
        run: ls -la apks/

      - name: Find apksigner
        id: find_signer
        run: |
          set -e
          # apksigner is shipped with Android build-tools on the runner
          SIGNER=$(find $ANDROID_HOME -name apksigner 2>/dev/null | head -1 || true)
          if [ -z "$SIGNER" ]; then
            # Fallback: search common locations
            SIGNER=$(find /usr/local/lib/android -name apksigner 2>/dev/null | head -1 || true)
          fi
          if [ -z "$SIGNER" ]; then
            echo "ERROR: apksigner not found on runner."
            echo "Available build-tools:"
            ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || true
            ls -la /usr/local/lib/android/sdk/build-tools/ 2>/dev/null || true
            exit 1
          fi
          echo "apksigner: $SIGNER"
          echo "path=$SIGNER" >> "$GITHUB_OUTPUT"

      - name: Verify each APK with apksigner
        env:
          APKSIGNER: ${{ steps.find_signer.outputs.path }}
        run: |
          set -e
          for apk in apks/*.apk; do
            echo "--- Verifying: $apk ---"
            "$APKSIGNER" verify --print-certs --verbose "$apk" || {
              echo "Verification failed for $apk"
              exit 1
            }
            echo "--- OK: $apk ---"
          done
          echo "All APKs verified."

      - name: Upload verified APKs (per-ABI)
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-verified
          path: apks/*.apk
          retention-days: 30
          if-no-files-found: error

  # ============================================================
  # 4. Android instrumentation tests (on emulator)
  # ============================================================
  # Boots an Android emulator on the GitHub runner and runs the
  # instrumentation suite (`./gradlew connectedDebugAndroidTest`).
  # This is the regression net for the launch-time crash that
  # prompted the ProGuard / theme / manifest fixes — `MainActivityTest
  # .appLaunchesWithoutCrash` will fail here before any release
  # can ship.
  # ============================================================
  android-instrumented-test:
    name: Android — instrumentation tests
    needs: android-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0777"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest --no-daemon
          working-directory: android

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-reports
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
          retention-days: 14
          if-no-files-found: warn

  # ============================================================
  # 5. Create GitHub Release with all artifacts (push to main only)
  # ============================================================
  release:
    name: Create GitHub Release
    needs: [web-test, android-test, android-split-apks, android-instrumented-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          set -e
          mkdir -p release
          # Move APKs to release/
          find artifacts/android-apks-verified -name '*.apk' -exec cp {} release/ \; 2>/dev/null || true
          find artifacts/android-apks -name '*.apk' -exec cp {} release/ \; 2>/dev/null || true
          # Zip the web build
          if [ -d "artifacts/web-build" ]; then
            (cd artifacts && zip -qr ${{ github.workspace }}/release/web-build.zip web-build)
          fi
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            ## Tahlil & Doa — Release v${{ github.run_number }}

            Built from commit ${{ github.sha }} on branch ${{ github.ref_name }}.

            ### Artifacts

            - **Android APKs** (per-ABI + universal):
              - `app-arm64-v8a-release.apk` (modern 64-bit ARM)
              - `app-armeabi-v7a-release.apk` (legacy 32-bit ARM)
              - `app-x86_64-release.apk` (emulators / x86_64 devices)
              - `app-universal-release.apk` (all ABIs in one APK)
            - **Web build** — `web-build.zip` (Next.js standalone output)

            ### Source

            Commit: ${{ github.sha }}
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            release/*.apk
            release/*.zip
          draft: false
          prerelease: false
