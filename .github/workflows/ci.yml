name: CI

# ============================================================
# Tahlil — Continuous Integration & Delivery Pipeline
# ============================================================
#
# Triggers:
#   - push to main          → auto-fix → tests → build → release
#   - pull request to main  → auto-fix → tests only (no release)
#   - manual dispatch       → everything (optionally force release)
#
# Pipeline (parallel where possible):
#   1. auto-fix                → ktlint --format (Kotlin) + prettier (web); commits & pushes if changes
#   2. web-test                → Next.js lint + build + vitest unit tests      (depends: auto-fix)
#   3. web-e2e                 → Playwright e2e (variant toggle)             (depends: web-test)
#   4. android-test            → Gradle lint + unit tests + assembleRelease   (depends: auto-fix)
#   5. android-split-apks      → verify each split APK with apksigner         (depends: android-test)
#   6. android-instrumented-test → e2e on emulator API 29 + verify release launches (depends: android-test)
#   7. release                 → GitHub Release with signed split-per-ABI APKs (depends: all)
#
# Signing scheme:
#   The keystore is shipped as a password-protected zip (key-sign-apk.zip)
#   base64-encoded in the KEYSTORE_ZIP_BASE64 secret. CI decodes it, then
#   unzips with KEYSTORE_ZIP_PASSWORD to extract the *.jks. The keystore
#   password / key alias / key password are separate secrets.
#
# Required secrets:
#   - KEYSTORE_ZIP_BASE64     base64 of password-protected key-sign-apk.zip
#   - KEYSTORE_ZIP_PASSWORD    password to unzip key-sign-apk.zip
#   - KEYSTORE_PASSWORD        keystore password (JKS)
#   - KEY_ALIAS                key alias inside the keystore
#   - KEY_PASSWORD             password for the key alias
#
# Fast-build techniques used:
#   - Gradle: daemon=false, caching=true, configuration-on-demand, parallel,
#     build-cache, dependency-cache via gradle/actions/setup-gradle
#   - npm: cache via actions/setup-node
#   - Cancel in-progress runs on the same ref (concurrency)
#   - Parallel web/android tracks
#   - Auto-fix prevents format-only round-trips blocking the pipeline
# ============================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_release:
        description: "Force-create a GitHub Release with all artifacts"
        type: boolean
        default: false

# Cancel any in-flight run when a new commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# softprops/action-gh-release needs contents:write to publish releases.
# The auto-fix step needs contents:write to push formatting commits.
permissions:
  contents: write
  pull-requests: write

jobs:
  # ============================================================
  # 1. Auto-fix — format code & push if changed
  # ============================================================
  # Runs ktlint --format on Kotlin sources and prettier --write on web
  # sources. If anything changed, commits with GITHUB_TOKEN (which by
  # design does NOT re-trigger workflows, avoiding infinite loops) and
  # exposes the new HEAD SHA so downstream jobs check out the fixed
  # commit instead of the original.
  # ============================================================
  auto-fix:
    name: Auto-fix (format)
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.commit.outputs.head_sha }}
      fixed: ${{ steps.commit.outputs.fixed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Format web (prettier)
        working-directory: web
        run: |
          # Install prettier locally (no package.json dep required) — fast & cached.
          npm install --no-save --no-package-lock prettier@^3.3.3 2>/dev/null || true
          if npx prettier --version >/dev/null 2>&1; then
            echo "Running prettier --write on web/src and web/e2e..."
            npx prettier --write "src/**/*.{ts,tsx,js,jsx,json,css,md}" "e2e/**/*.ts" 2>/dev/null || true
          else
            echo "prettier unavailable — skipping web format"
          fi

      - name: Format Kotlin (ktlint)
        working-directory: android
        run: |
          set -e
          # Download ktlint as a standalone JAR (no Gradle plugin needed — keeps
          # build.gradle.kts untouched). Pin to a known-good version.
          KTLINT_VERSION=1.3.1
          curl -fsSL -o /tmp/ktlint "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x /tmp/ktlint
          echo "Running ktlint --format on app/src..."
          # --format writes fixes in place. Exit code 0 = clean or auto-fixed.
          # We intentionally don't fail the job on remaining issues — the test
          # jobs downstream will catch real compile errors. Format-only nits
          # should never block a release.
          /tmp/ktlint --format app/src/**/*.kt || true

      - name: Commit & push if anything changed
        id: commit
        run: |
          set -e
          if git diff --quiet && git diff --staged --quiet; then
            echo "No formatting changes needed."
            echo "fixed=false" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: auto-fix formatting [skip ci]"
            git push
            echo "fixed=true" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Pushed formatting fixes."
          fi

  # ============================================================
  # 2. Web — lint + build + vitest unit tests
  # ============================================================
  web-test:
    name: Web — lint, build, unit tests
    needs: auto-fix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout (at auto-fix HEAD)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-fix.outputs.head_sha }}

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Unit tests (vitest)
        run: npm test
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build (Next.js)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            web/.next
            web/public
            web/package.json
            web/next.config.ts
            web/next-env.d.ts
          retention-days: 14
          if-no-files-found: error

      - name: Upload web test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-reports
          path: |
            web/coverage
            web/test-results
          retention-days: 14
          if-no-files-found: warn

  # ============================================================
  # 3. Web — Playwright e2e (variant toggle, navigation)
  # ============================================================
  web-e2e:
    name: Web — e2e (Playwright)
    needs: web-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout (at auto-fix HEAD)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-fix.outputs.head_sha }}

      - name: Setup Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium only — fastest)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
          if-no-files-found: warn

  # ============================================================
  # 4. Android — lint, unit tests, assembleRelease
  # ============================================================
  android-test:
    name: Android — lint, unit, assemble
    needs: auto-fix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.configuration-cache=true"
    steps:
      - name: Checkout (at auto-fix HEAD)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-fix.outputs.head_sha }}

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle (cache + daemon-off)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode & unzip signing keystore (password-protected zip)
        id: keystore
        env:
          KEYSTORE_ZIP_BASE64: ${{ secrets.KEYSTORE_ZIP_BASE64 }}
          KEYSTORE_ZIP_PASSWORD: ${{ secrets.KEYSTORE_ZIP_PASSWORD }}
        run: |
          set -e
          if [ -z "$KEYSTORE_ZIP_BASE64" ]; then
            echo "No signing secrets — using debug signing."
            echo "keystore_present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Decode the base64 zip into a temp file
          echo "$KEYSTORE_ZIP_BASE64" | base64 -d > "$RUNNER_TEMP/key-sign-apk.zip"
          # Verify the zip is valid before unzipping
          unzip -t "$RUNNER_TEMP/key-sign-apk.zip" >/dev/null 2>&1 || {
            echo "ERROR: key-sign-apk.zip is corrupt or not a valid zip."
            exit 1
          }
          # Unzip with the password into a fresh dir
          rm -rf "$RUNNER_TEMP/keystore"
          mkdir -p "$RUNNER_TEMP/keystore"
          unzip -o -P "$KEYSTORE_ZIP_PASSWORD" "$RUNNER_TEMP/key-sign-apk.zip" -d "$RUNNER_TEMP/keystore/" >/dev/null
          # Locate the keystore inside (any *.jks or *.keystore)
          JKS=$(find "$RUNNER_TEMP/keystore" -type f \( -name "*.jks" -o -name "*.keystore" \) | head -1)
          if [ -z "$JKS" ]; then
            echo "ERROR: no *.jks or *.keystore found inside the unzipped archive."
            echo "Archive contents:"
            ls -la "$RUNNER_TEMP/keystore/"
            exit 1
          fi
          echo "Signing keystore extracted: $JKS"
          echo "KEYSTORE_PATH=$JKS" >> "$GITHUB_ENV"
          echo "keystore_present=true" >> "$GITHUB_OUTPUT"

      - name: Gradle lint
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew lint --no-daemon --stacktrace

      - name: Unit tests
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build signed release APK(s) — split per ABI
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: |
            android/app/build/reports/lint-results-*.html
            android/app/build/reports/lint-results-*.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests
            android/app/build/test-results
          retention-days: 14
          if-no-files-found: warn

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error

  # ============================================================
  # 5. Verify each split APK with apksigner
  # ============================================================
  android-split-apks:
    name: Android — verify split APKs (apksigner)
    needs: android-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-fix.outputs.head_sha }}

      - name: Setup JDK 17 (for apksigner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: apks

      - name: List APKs
        run: ls -la apks/

      - name: Find apksigner
        id: find_signer
        run: |
          set -e
          SIGNER=$(find $ANDROID_HOME -name apksigner 2>/dev/null | head -1 || true)
          if [ -z "$SIGNER" ]; then
            SIGNER=$(find /usr/local/lib/android -name apksigner 2>/dev/null | head -1 || true)
          fi
          if [ -z "$SIGNER" ]; then
            echo "ERROR: apksigner not found on runner."
            ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || true
            exit 1
          fi
          echo "apksigner: $SIGNER"
          echo "path=$SIGNER" >> "$GITHUB_OUTPUT"

      - name: Verify each APK with apksigner
        env:
          APKSIGNER: ${{ steps.find_signer.outputs.path }}
        run: |
          set -e
          for apk in apks/*.apk; do
            echo "--- Verifying: $apk ---"
            "$APKSIGNER" verify --print-certs --verbose "$apk" || {
              echo "Verification failed for $apk"
              exit 1
            }
            echo "--- OK: $apk ---"
          done
          echo "All APKs verified."

      - name: Upload verified APKs (per-ABI)
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-verified
          path: apks/*.apk
          retention-days: 30
          if-no-files-found: error

  # ============================================================
  # 6. Android instrumentation (e2e) tests + release APK launch check
  # ============================================================
  # Boots an Android emulator on the GitHub runner and:
  #   1. Runs the instrumentation suite (`connectedDebugAndroidTest`)
  #   2. Installs the ACTUAL release APK and verifies it launches into
  #      the foreground without crashing — closes the gap that let
  #      release-only crashes (R8 / signing) reach users.
  # Single API level (29) keeps the pipeline fast.
  # ============================================================
  android-instrumented-test:
    name: Android — e2e (emulator API 29)
    needs: android-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true -Dorg.gradle.parallel=true"
    steps:
      - name: Checkout (at auto-fix HEAD)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-fix.outputs.head_sha }}

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: downloaded-apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0777"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write release verification script
        run: |
          cat > /tmp/verify_release.sh << 'VERIFY_EOF'
          #!/bin/bash
          set -e

          echo "=== Running instrumentation tests (debug build) ==="
          ./gradlew connectedDebugAndroidTest --no-daemon

          echo ""
          echo "=== Installing release APK ==="
          adb install -r "$GITHUB_WORKSPACE/downloaded-apks/app-universal-release.apk"

          echo ""
          echo "=== Launching release APK ==="
          adb logcat -c
          adb shell am start -n com.tahlildoa.app/.MainActivity
          sleep 8

          FOREGROUND=$(adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | grep -c "com.tahlildoa.app" || true)
          echo "Foreground check result: $FOREGROUND"

          CRASH=$(adb logcat -d -s TahlilCrash:E AndroidRuntime:E | grep -E "Exception:|FATAL EXCEPTION|IncompatibleClassChange|Caused by:" | head -10 || true)

          if [ "$FOREGROUND" -eq "0" ]; then
            echo ""
            echo "=== ERROR: Release APK crashed on launch! ==="
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" || true
            echo ""
            echo "=== TahlilCrash (head) ==="
            adb logcat -d -s TahlilCrash:E | head -30
            echo ""
            echo "=== AndroidRuntime fatal ==="
            adb logcat -d -s AndroidRuntime:E | head -50
            exit 1
          fi

          if [ -n "$CRASH" ]; then
            echo ""
            echo "=== WARNING: Crash logs detected but app is running ==="
            echo "$CRASH"
            echo "Continuing since the app is in the foreground..."
          fi

          echo ""
          echo "=== OK: Release APK launches successfully and is in foreground ==="
          VERIFY_EOF
          chmod +x /tmp/verify_release.sh

      - name: Run instrumentation tests + verify release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: /tmp/verify_release.sh
          working-directory: android

      - name: Upload e2e test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-reports
          path: |
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results
          retention-days: 14
          if-no-files-found: warn

  # ============================================================
  # 7. Create GitHub Release with all artifacts (push to main only)
  # ============================================================
  release:
    name: Create GitHub Release
    needs: [auto-fix, web-test, web-e2e, android-test, android-split-apks, android-instrumented-test]
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' && github.event.inputs.force_release == 'true'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (at auto-fix HEAD)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-fix.outputs.head_sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          set -e
          mkdir -p release
          # Move verified APKs to release/ (fall back to non-verified if needed)
          find artifacts/android-apks-verified -name '*.apk' -exec cp {} release/ \; 2>/dev/null || true
          find artifacts/android-apks -name '*.apk' -exec cp {} release/ \; 2>/dev/null || true
          # Zip the web build
          if [ -d "artifacts/web-build" ]; then
            (cd artifacts && zip -qr ${{ github.workspace }}/release/web-build.zip web-build)
          fi
          # Read the real versionName so the release body never drifts
          APP_VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts | head -1)
          echo "APP_VERSION=${APP_VERSION:-unknown}" >> "$GITHUB_ENV"
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            ## Tahlil — Release v${{ github.run_number }}

            Built from commit ${{ needs.auto-fix.outputs.head_sha }} on branch ${{ github.ref_name }}.

            ### 📱 Unduh APK (signed release, pilih SESUAI perangkat)

            | File | Untuk perangkat |
            |------|-----------------|
            | `app-arm64-v8a-release.apk` | ⭐ **Ponsel modern (rekomendasi)** — hampir semua ponsel sejak 2018 (Redmi, Samsung, Pixel, Oppo, Vivo, dll.) |
            | `app-armeabi-v7a-release.apk` | Ponsel lama 32-bit ARM (sebelum ~2016) |
            | `app-x86_64-release.apk` | Emulator / tablet Intel |
            | `app-universal-release.apk` | Semua arsitektur dalam satu file (paling besar — pakai hanya jika bingung) |

            Cara cek arsitektur: aplikasi CPU-Z, atau situs "what is my android cpu abi". Ragu? Ambil **arm64-v8a**.

            Semua APK di atas **signed release** (satu kunci yang sama). Versi aplikasi: ${{ env.APP_VERSION }}.

            Fitur baru: toggle **Singkat / Lengkap** — varian Lengkap menambahkan ayat-ayat Surah Yasin.

            ### 🌐 Web

            - `web-build.zip` (Next.js output)

            ### Verifikasi otomatis

            - ✅ Web: lint + vitest unit test + Playwright e2e (variant toggle)
            - ✅ Android: lint + unit test + instrumented test (API 29)
            - ✅ APK release di-install & di-launch di emulator — pipeline gagal jika force-close
            - ✅ Signature setiap APK diverifikasi apksigner

            ### Source

            Commit: ${{ needs.auto-fix.outputs.head_sha }}
            Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            release/*.apk
            release/*.zip
          draft: false
          prerelease: false
